# dev profile：docker 中间件（MySQL/Redis）就绪前的本地开发回退方案
# 使用 H2 内存库（MySQL 兼容模式），docker 环境搭好后切回默认配置（application.yml）
spring:
  datasource:
    url: jdbc:h2:mem:aether;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
