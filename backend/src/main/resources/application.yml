# Aether 后端公共配置
# 生产环境通过环境变量覆盖（BackEnd-Plan §11.2），本地开发使用 dev profile：
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
server:
  servlet:
    context-path: /aether/api

spring:
  application:
    name: aether
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aether?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 生产环境表结构以 schema-mysql.sql 为准，禁止自动建表
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      # 单分片 8MB + 余量（合并走接口不占 multipart）
      max-file-size: 16MB
      max-request-size: 16MB

# ===== Aether 业务配置（BackEnd-Plan §4/§8） =====
aether:
  media:
    # ffprobe 可执行文件路径（时长探测，§8.2）；生产 backend 容器内置，dev 本机无则回退 MP4 内置解析
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
  cache:
    # 缓存实现：redis（prod）/ memory（dev 回退，Redis 未就绪时）
    store: ${CACHE_STORE:redis}
  jwt:
    # 签名密钥：生产必须环境变量注入（≥32 字节）；dev 默认值见 application-dev.yml
    secret: ${JWT_SECRET:}
    access-expire-minutes: 30
    refresh-expire-days: 7
    # Refresh Cookie Secure：https 环境开启（dev http 环境覆盖为 false）
    refresh-secure: ${JWT_REFRESH_SECURE:true}
  storage:
    local-base-dir: ${STORAGE_DIR:./data/storage}
    chunk-size-mb: 8
    # 签名 URL 密钥：生产必须环境变量注入；dev 默认值见 application-dev.yml
    sign-secret: ${SIGN_SECRET:}
    sign-expire-seconds: 600

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
