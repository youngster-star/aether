# Aether 后端公共配置
# 生产环境通过环境变量覆盖（BackEnd-Plan §11.2），本地开发使用 dev profile：
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
server:
  servlet:
    context-path: /aether/api

spring:
  application:
    name: aether
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aether?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 生产环境由 Flyway/手动迁移管理表结构，禁止自动建表
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
