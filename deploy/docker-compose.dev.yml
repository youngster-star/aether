# Aether 开发环境中间件
# 说明：Docker 环境在项目末期统一安装配置（当前本地开发用 backend dev profile 的 H2 回退方案）
# 启动：docker compose -f deploy/docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: aether-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-aether_dev}
      MYSQL_DATABASE: aether
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-aether_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: aether-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-aether_dev} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aether_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ollama 本地模型服务（宿主机已有 ollama 时可注释掉本服务，改用 http://host.docker.internal:11434）
  ollama:
    image: ollama/ollama:latest
    container_name: aether-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  redis_data:
  ollama_data:
