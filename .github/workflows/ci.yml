# Aether 基础 CI（阶段0）：后端编译测试 + 前端构建
# 分支策略：main（仅合并）/ dev（日常开发）/ feature/*（功能分支），见 Stage.md §1.2
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build with Maven
        # dev profile：H2 内存库，无需外部中间件
        run: mvn -B verify -Dspring.profiles.active=dev -f backend/pom.xml

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
